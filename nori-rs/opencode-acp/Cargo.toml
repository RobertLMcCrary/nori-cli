[package]
name = "nori-opencode-acp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
agent-client-protocol = { version = "=0.14.0", features = ["unstable"] }
base64 = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
anyhow = { workspace = true }
nori-acp-host = { workspace = true }
nori-protocol = { workspace = true }
pretty_assertions = { workspace = true }

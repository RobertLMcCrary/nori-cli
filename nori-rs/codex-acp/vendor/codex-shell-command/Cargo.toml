[package]
name = "codex-shell-command"
version = "0.137.0"
edition = "2024"
license = "Apache-2.0"

# Vendored from openai/codex rust-v0.137.0 with tree-sitter raised to the version Nori links, since only one
# copy of that native library may exist in the build.

[lib]
doctest = false

[dependencies]
base64 = "0.22.1"
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.137.0" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", tag = "rust-v0.137.0" }
once_cell = "1.20.2"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3.0"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
url = "2"
which = "8"

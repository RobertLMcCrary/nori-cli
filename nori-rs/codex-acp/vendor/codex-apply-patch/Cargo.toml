[package]
name = "codex-apply-patch"
version = "0.137.0"
edition = "2024"
license = "Apache-2.0"

# Vendored from openai/codex rust-v0.137.0 with tree-sitter raised to the version Nori links, since only one
# copy of that native library may exist in the build.

[lib]
name = "codex_apply_patch"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
codex-exec-server = { git = "https://github.com/openai/codex", tag = "rust-v0.137.0" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", tag = "rust-v0.137.0" }
similar = "2.7.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["macros", "rt"] }
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"

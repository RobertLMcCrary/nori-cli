[package]
name = "codex-acp"
version = "0.16.0"
edition = "2024"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "An ACP-compatible coding agent powered by Codex"
repository = "https://github.com/zed-industries/codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"

[[bin]]
name = "codex-acp"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.14.0", features = ["unstable"] }
anyhow = "1"
clap = "4"
codex-apply-patch = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-arg0 = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-history = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-utils-path-uri = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-http-client = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-core-api = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-config = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-core = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-exec-server = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-extension-api = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-models-manager = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-login = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-shell-command = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-thread-store = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-utils-approval-presets = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
codex-utils-cli = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0" }
diffy = { version = "0.5.0", features = ["std"] }
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
# codex-cli depends on codex-tui, which enables serde_json/preserve_order; match
# that behavior here because it affects MCP keychain account hashing.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
heck = "0.5.0"
unicode-segmentation = "1.11.0"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
